
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jormungandr</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Matrix Background -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Main Website Content -->
    <div class="content-container">
        <div class="terminal-shell">

            <h1 class="glow-heading">Jormungandr</h1>

            <div class="subtitle">
                <span class="typed-text">
                    &gt;&gt; serpent node engaged
                </span>

                <span class="typed-text delay">
                    &gt;&gt; data stream: active
                </span>

                <button
                    class="terminal-link typed-text delay"
                    id="opinions-toggle"
                    type="button">
                    &gt;&gt; opinions
                </button>
            </div>

            <!-- Blog Article Panel -->
            <div class="blog-post" id="opinions-panel">
                <p class="blog-meta">// loading posts...</p>
            </div>

        </div>
    </div>

    <!-- Matrix Animation -->
    <script src="matrix.js"></script>

    <script>
        const toggle = document.getElementById('opinions-toggle');
        const panel = document.getElementById('opinions-panel');

        // Show or hide the blog panel
        function setPostsView(isOpen) {
            panel.classList.toggle('active', isOpen);
            document.body.classList.toggle('posts-open', isOpen);

            toggle.textContent = isOpen
                ? '>> opinions: expanded'
                : '>> opinions';
        }

        // Create a return button
        function createReturnButton() {
            const button = document.createElement('button');

            button.className = 'return-link';
            button.type = 'button';
            button.textContent = '<< return';

            button.addEventListener('click', () => {
                setPostsView(false);
            });

            return button;
        }

        // Render articles on the website
        function renderPosts(posts) {
            panel.replaceChildren();

            // Return button
            panel.appendChild(createReturnButton());

            if (!posts.length) {
                const message = document.createElement('p');
                message.className = 'blog-meta';
                message.textContent = '// no posts found';

                panel.appendChild(message);
                return;
            }

            posts.forEach((post, index) => {
                const article = document.createElement('article');
                article.className = 'post-entry';

                // Post number
                const meta = document.createElement('p');
                meta.className = 'blog-meta';
                meta.textContent = `// post ${index + 1}`;

                // Article title
                const heading = document.createElement('h2');
                heading.textContent = post.title || 'Untitled';

                // Article content
                const body = document.createElement('div');
                body.className = 'post-body';

                const content = String(post.content || '')
                    .replace(/\r\n?/g, '\n');

                const paragraphs = content
                    .split(/\n\s*\n/)
                    .map(text => text.trim())
                    .filter(Boolean);

                paragraphs.forEach(text => {
                    const paragraph = document.createElement('p');

                    const lines = text.split('\n');

                    lines.forEach((line, lineIndex) => {
                        if (lineIndex > 0) {
                            paragraph.appendChild(
                                document.createElement('br')
                            );
                        }

                        paragraph.appendChild(
                            document.createTextNode(line)
                        );
                    });

                    body.appendChild(paragraph);
                });

                // Assemble article
                article.appendChild(meta);
                article.appendChild(heading);
                article.appendChild(body);

                panel.appendChild(article);
            });
        }

        // Load articles from the GitHub Pages JSON file
        async function loadPosts() {
            try {
                const response = await fetch(
                    './posts/posts.json',
                    { cache: 'no-store' }
                );

                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}: ${response.statusText}`
                    );
                }

                const posts = await response.json();

                if (!Array.isArray(posts)) {
                    throw new Error(
                        'Invalid article data: expected an array.'
                    );
                }

                // Sort newest articles first
                posts.sort((a, b) => {
                    const dateA = Date.parse(a.date || '') || 0;
                    const dateB = Date.parse(b.date || '') || 0;

                    return dateB - dateA;
                });

                renderPosts(posts);

            } catch (error) {
                console.error('Failed to load posts:', error);

                panel.replaceChildren();

                panel.appendChild(createReturnButton());

                const message = document.createElement('p');
                message.className = 'blog-meta';
                message.textContent =
                    `// ERROR LOADING POSTS: ${error.message}`;

                panel.appendChild(message);
            }
        }

        // Open and close the blog
        toggle.addEventListener('click', () => {
            const isOpen = !panel.classList.contains('active');
            setPostsView(isOpen);
        });

        // Load articles when the website starts
        loadPosts();

    </script>

</body>
</html>
